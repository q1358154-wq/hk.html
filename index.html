<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>双模播放器 - 完美联动终极版</title>
  <style>
    body { background: #0b0f0e; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; min-height: 100vh; overflow-y: auto; }
    
    .card { background: #131c18; padding: 14px; border-radius: 14px; border: 1px solid rgba(52, 211, 153, 0.15); box-sizing: border-box; display: flex; flex-direction: column; }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    h3 { margin: 0; font-size: 14px; color: #34d399; font-weight: 600; letter-spacing: 0.5px; }
    
    .visualizer { width: 45px; height: 20px; background: rgba(0,0,0,0.3); border-radius: 6px; display: block; border: 1px solid rgba(52, 211, 153, 0.1); }

    input[type="file"] { width: 100%; margin-bottom: 8px; color: #a7f3d0; font-size: 12px; }
    input[type="file"]::file-selector-button { background: #064e3b; color: #34d399; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; }

    .select-box { margin-bottom: 8px; display: flex; align-items: center; gap: 6px; background: rgba(52, 211, 153, 0.05); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(52, 211, 153, 0.1); }
    .select-box label { font-size: 11px; color: #6ee7b7; font-weight: 500; }
    select { flex: 1; background: #064e3b; color: #34d399; border: none; padding: 5px 8px; border-radius: 6px; font-size: 11px; outline: none; font-weight: 500; }

    button { width: 100%; padding: 8px; margin: 3px 0; background: #059669; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 500; }
    button.off { background: #1f2923; color: #6b7280; border: 1px solid rgba(255,255,255,0.05); }
    button:disabled { opacity: 0.25; cursor: not-allowed; }
    
    video { width: 100%; max-height: 25vh; border-radius: 8px; margin-bottom: 8px; background: #000; border: 1px solid rgba(52, 211, 153, 0.1); object-fit: contain; }
    .tip { font-size: 11px; color: #34d399; margin-top: 6px; opacity: 0.9; }
    
    /* 现代化便捷控制面板：改用清晰的横向滑块，保证 100% 灵敏好用 */
    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; border: 1px solid rgba(52, 211, 153, 0.08); }
    .control-item { display: flex; flex-direction: column; gap: 3px; }
    .control-item label { font-size: 10px; color: #6ee7b7; display: flex; justify-content: space-between; }
    .control-item label span { color: #34d399; font-weight: 600; }
    
    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 6px; border-radius: 3px;
      background: rgba(52, 211, 153, 0.2); outline: none; margin: 4px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #34d399; cursor: pointer; border: 2px solid #0b0f0e;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h3>🎵 独立音频区 (MP3 / WAV)</h3>
    <canvas id="aCanvas" class="visualizer" width="45" height="20"></canvas>
  </div>
  <input type="file" id="aFile" accept=".mp3,.wav">
  
  <div class="select-box">
    <label>🎧 音效风格：</label>
    <select id="aPreset">
      <option value="normal">标准原声 (Normal)</option>
      <option value="bass">超重低音 (Bass Boost)</option>
      <option value="vocal">清澈人声 (Vocal Clear)</option>
      <option value="live">Live现场混响 (Concert Hall)</option>
      <option value="vinyl">黑胶复古模拟 (Vinyl Warmth)</option>
      <option value="space">8D 环绕动态 (8D Space)</option>
    </select>
  </div>

  <button id="aPlay" disabled>播放音频</button>
  <button id="aStop" disabled>停止音频</button>
  <button id="aLoop" class="off" disabled>🔁 循环: 关</button>

  <div class="controls-grid">
    <div class="control-item">
      <label>音频速度 <span id="aSpeedVal">1.0x</span></label>
      <input type="range" id="aSpeed" min="5" max="20" value="10">
    </div>
    <div class="control-item">
      <label>音量大小 <span id="aVolVal">80%</span></label>
      <input type="range" id="aVol" min="0" max="100" value="80">
    </div>
  </div>
  <div class="tip" id="aStatus">等待选择音频...</div>
</div>

<div class="card">
  <div class="card-header">
    <h3>🎬 独立视频区 (MP4 + 实时全音效引擎)</h3>
    <canvas id="vCanvas" class="visualizer" width="45" height="20"></canvas>
  </div>
  <input type="file" id="vFile" accept=".mp4,.mov">
  <video id="vEl" controls playsinline preload="metadata"></video>
  
  <div class="select-box">
    <label>🎬 音效风格：</label>
    <select id="vPreset">
      <option value="normal">标准原声 (Normal)</option>
      <option value="bass">超重低音 (Bass Boost)</option>
      <option value="vocal">清澈人声 (Vocal Clear)</option>
      <option value="live">Live现场混响 (Concert Hall)</option>
      <option value="vinyl">黑胶复古模拟 (Vinyl Warmth)</option>
      <option value="space">8D 环绕动态 (8D Space)</option>
    </select>
  </div>

  <button id="vLoop" class="off" disabled>🔁 循环: 关</button>

  <div class="controls-grid">
    <div class="control-item">
      <label>视频速度 <span id="vSpeedVal">1.0x</span></label>
      <input type="range" id="vSpeed" min="5" max="20" value="10">
    </div>
    <div class="control-item">
      <label>音量大小 <span id="vVolVal">100%</span></label>
      <input type="range" id="vVol" min="0" max="100" value="100">
    </div>
  </div>
  <div class="tip" id="vStatus">等待选择视频...</div>
</div>

<script>
function applyPreset(preset, eqLow, eqMid, eqHigh) {
  eqLow.gain.value = 0; eqMid.gain.value = 0; eqHigh.gain.value = 0;
  switch(preset) {
    case 'bass': eqLow.gain.value = 12; eqMid.gain.value = -2; eqHigh.gain.value = 2; break;
    case 'vocal': eqLow.gain.value = -3; eqMid.gain.value = 8; eqHigh.gain.value = 5; break;
    case 'live': eqLow.gain.value = 4; eqMid.gain.value = 3; eqHigh.gain.value = 6; break;
    case 'vinyl': eqLow.gain.value = 2; eqMid.gain.value = -4; eqHigh.gain.value = -8; break;
  }
}

// 音频逻辑
let aCtx, aPanner, aGain, aAnalyser, aBuf, aSrc, aPlayState = false, aLoopState = false;
let aEqLow, aEqMid, aEqHigh, aAnim, aAngle = 0, aCurrentPreset = 'normal';

const aFile = document.getElementById('aFile'), aPlay = document.getElementById('aPlay'), aStop = document.getElementById('aStop'), aLoop = document.getElementById('aLoop'), aStatus = document.getElementById('aStatus'), aVol = document.getElementById('aVol'), aVolVal = document.getElementById('aVolVal'), aSpeed = document.getElementById('aSpeed'), aSpeedVal = document.getElementById('aSpeedVal'), aCanvas = document.getElementById('aCanvas'), aPreset = document.getElementById('aPreset');
const aCanvasCtx = aCanvas.getContext('2d');

aFile.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (!aCtx) {
    aCtx = new (window.AudioContext || window.webkitAudioContext)();
    aAnalyser = aCtx.createAnalyser(); aAnalyser.fftSize = 32;
    aPanner = aCtx.createPanner(); aPanner.panningModel = 'HRTF';
    aGain = aCtx.createGain(); aGain.gain.value = aVol.value / 100;
    aEqLow = aCtx.createBiquadFilter(); aEqLow.type = 'lowshelf'; aEqLow.frequency.value = 250;
    aEqMid = aCtx.createBiquadFilter(); aEqMid.type = 'peaking'; aEqMid.frequency.value = 1500;
    aEqHigh = aCtx.createBiquadFilter(); aEqHigh.type = 'highshelf'; aEqHigh.frequency.value = 4000;
  }
  if (aCtx.state === 'suspended') aCtx.resume();
  aStatus.textContent = "音频解码中...";
  aBuf = await aCtx.decodeAudioData(await f.arrayBuffer());
  aPlay.disabled = false; aStop.disabled = false; aLoop.disabled = false;
  aStatus.textContent = "音频就绪";
});

aPreset.addEventListener('change', e => {
  aCurrentPreset = e.target.value;
  if (aEqLow) applyPreset(aCurrentPreset, aEqLow, aEqMid, aEqHigh);
});

aPlay.addEventListener('click', () => {
  if (aSrc) { aSrc.stop(); aSrc.disconnect(); }
  aSrc = aCtx.createBufferSource(); 
  aSrc.buffer = aBuf;
  aSrc.loop = aLoopState;
  aSrc.connect(aEqLow); aEqLow.connect(aEqMid); aEqMid.connect(aEqHigh); aEqHigh.connect(aPanner); aPanner.connect(aAnalyser); aAnalyser.connect(aGain); aGain.connect(aCtx.destination);
  applyPreset(aCurrentPreset, aEqLow, aEqMid, aEqHigh);
  aSrc.start(0);
  aPlayState = true; 
  aStatus.textContent = "▶ 播放中 [" + aPreset.options[aPreset.selectedIndex].text + "]";
  runAOrbit();
  drawAVisualizer();
  aSrc.onended = () => {
    if (!aLoopState && aPlayState) {
      aPlayState = false; cancelAnimationFrame(aAnim);
      aStatus.textContent = "播放完毕";
      aCanvasCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);
    }
  };
});

aStop.addEventListener('click', () => {
  if (aSrc) { aSrc.stop(); aSrc.disconnect(); aSrc = null; }
  aPlayState = false; cancelAnimationFrame(aAnim);
  if (aPanner) { aPanner.positionX.value = 0; aPanner.positionZ.value = 1; }
  aStatus.textContent = "已停止";
  aCanvasCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);
});

aLoop.addEventListener('click', () => {
  aLoopState = !aLoopState;
  aLoop.textContent = aLoopState ? "🔁 循环: 开" : "🔁 循环: 关";
  aLoop.className = aLoopState ? "" : "off";
  if (aSrc) { aSrc.loop = aLoopState; }
});

aVol.addEventListener('input', e => {
  const val = e.target.value;
  aVolVal.textContent = val + '%';
  if (aGain) aGain.gain.value = val / 100;
});

aSpeed.addEventListener('input', e => {
  const val = e.target.value;
  const speedRate = val * 0.1;
  aSpeedVal.textContent = speedRate.toFixed(1) + 'x';
  if (aSrc) {
    // 动态调整 Web Audio 播放速度
    aSrc.playbackRate.value = speedRate;
  }
});

function runAOrbit() {
  if (!aPlayState) return;
  if (aCurrentPreset === 'space') {
    aAngle += 0.03 * (aSpeed.value / 10);
    if (aPanner) { aPanner.positionX.value = Math.cos(aAngle) * 2; aPanner.positionZ.value = Math.sin(aAngle) * 2; }
  } else {
    if (aPanner) { aPanner.positionX.value = 0; aPanner.positionZ.value = 1; }
  }
  aAnim = requestAnimationFrame(runAOrbit);
}

function drawAVisualizer() {
  if (!aPlayState) return;
  requestAnimationFrame(drawAVisualizer);
  const dataArray = new Uint8Array(aAnalyser.frequencyBinCount);
  aAnalyser.getByteFrequencyData(dataArray);
  aCanvasCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);
  const barWidth = 3; let x = 2;
  for (let i = 0; i < 6; i++) {
    let barHeight = (dataArray[i] / 255) * aCanvas.height;
    aCanvasCtx.fillStyle = '#34d399';
    aCanvasCtx.fillRect(x, aCanvas.height - barHeight, barWidth, barHeight);
    x += 5;
  }
}

// 视频逻辑（音速、音效速度、音量完美联动）
let vCtx, vPanner, vGain, vAnalyser, vSourceNode, vEqLow, vEqMid, vEqHigh, vAnim, vAngle = 0, vCurrentPreset = 'normal';
const vFile = document.getElementById('vFile'), vEl = document.getElementById('vEl'), vLoop = document.getElementById('vLoop'), vStatus = document.getElementById('vStatus'), vVol = document.getElementById('vVol'), vVolVal = document.getElementById('vVolVal'), vSpeed = document.getElementById('vSpeed'), vSpeedVal = document.getElementById('vSpeedVal'), vCanvas = document.getElementById('vCanvas'), vPreset = document.getElementById('vPreset');
const vCanvasCtx = vCanvas.getContext('2d');

vFile.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  vEl.src = URL.createObjectURL(f);
  vEl.load();
  vLoop.disabled = false;
  vStatus.textContent = "视频已就绪，点击播放";
});

vPreset.addEventListener('change', e => {
  vCurrentPreset = e.target.value;
  if (vEqLow) applyPreset(vCurrentPreset, vEqLow, vEqMid, vEqHigh);
});

vLoop.addEventListener('click', () => {
  vEl.loop = !vEl.loop;
  vLoop.textContent = vEl.loop ? "🔁 循环: 开" : "🔁 循环: 关";
  vLoop.className = vEl.loop ? "" : "off";
});

vEl.addEventListener('play', () => {
  if (!vCtx) {
    vCtx = new (window.AudioContext || window.webkitAudioContext)();
    vAnalyser = vCtx.createAnalyser(); vAnalyser.fftSize = 32;
    vPanner = vCtx.createPanner(); vPanner.panningModel = 'HRTF';
    vGain = vCtx.createGain(); vGain.gain.value = vVol.value / 100;
    
    vEqLow = vCtx.createBiquadFilter(); vEqLow.type = 'lowshelf'; vEqLow.frequency.value = 250;
    vEqMid = vCtx.createBiquadFilter(); vEqMid.type = 'peaking'; vEqMid.frequency.value = 1500;
    vEqHigh = vCtx.createBiquadFilter(); vEqHigh.type = 'highshelf'; vEqHigh.frequency.value = 4000;

    vSourceNode = vCtx.createMediaElementSource(vEl);
    vSourceNode.connect(vEqLow); 
    vEqLow.connect(vEqMid); 
    vEqMid.connect(vEqHigh); 
    vEqHigh.connect(vPanner); 
    vPanner.connect(vAnalyser); 
    vAnalyser.connect(vGain); 
    vGain.connect(vCtx.destination);
  }
  if (vCtx.state === 'suspended') vCtx.resume();
  applyPreset(vCurrentPreset, vEqLow, vEqMid, vEqHigh);
  runVOrbit();
  drawVVisualizer();
  vStatus.textContent = "🎬 视频播放中 [" + vPreset.options[vPreset.selectedIndex].text + "]";
});

vEl.addEventListener('pause', () => {
  cancelAnimationFrame(vAnim);
  vStatus.textContent = "视频已暂停";
  vCanvasCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);
});

vEl.addEventListener('ended', () => {
  cancelAnimationFrame(vAnim);
  vStatus.textContent = "视频播放完毕";
  vCanvasCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);
});

// 音量滑块：完美控制 gain 节点，响应极快
vVol.addEventListener('input', e => {
  const val = e.target.value;
  vVolVal.textContent = val + '%';
  if (vGain) vGain.gain.value = val / 100;
});

// 速度滑块：视频画面播放速度 + 8D环绕音效速度 同步联动！
vSpeed.addEventListener('input', e => {
  const val = e.target.value;
  const speedRate = val * 0.1;
  vSpeedVal.textContent = speedRate.toFixed(1) + 'x';
  vEl.playbackRate = speedRate;
});

function runVOrbit() {
  if (vEl.paused || vEl.ended) return;
  if (vCurrentPreset === 'space') {
    // 关键修复：把 8D 环绕旋转速度与当前视频速度滑块直接挂钩
    vAngle += 0.03 * (vSpeed.value / 10);
    if (vPanner) { vPanner.positionX.value = Math.cos(vAngle) * 2; vPanner.positionZ.value = Math.sin(vAngle) * 2; }
  } else {
    if (vPanner) { vPanner.positionX.value = 0; vPanner.positionZ.value = 1; }
  }
  vAnim = requestAnimationFrame(runVOrbit);
}

function drawVVisualizer() {
  if (vEl.paused || vEl.ended) return;
  requestAnimationFrame(drawVVisualizer);
  const dataArray = new Uint8Array(vAnalyser.frequencyBinCount);
  vAnalyser.getByteFrequencyData(dataArray);
  vCanvasCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);
  const barWidth = 3; let x = 2;
  for (let i = 0; i < 6; i++) {
    let barHeight = (dataArray[i] / 255) * vCanvas.height;
    vCanvasCtx.fillStyle = '#34d399';
    vCanvasCtx.fillRect(x, vCanvas.height - barHeight, barWidth, barHeight);
    x += 5;
  }
}
</script>
</body>
</html>
