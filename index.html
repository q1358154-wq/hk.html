<!DOCTYPE html>

<head>

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button, a, input, select {
      touch-action: manipulation;
    }

    body { 
      background: #030d08; 
      color: #ecfdf5; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      min-height: 100dvh;
      min-height: 100vh; 
      margin: 0; 
      padding: 12px; 
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    .card { 
      background: #071b12; 
      padding: 16px; 
      border-radius: 20px; 
      width: 100%; 
      max-width: 380px; 
      margin-bottom: 14px; 
      border: 1px solid rgba(16, 185, 129, 0.3); 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h3 { margin: 0; font-size: 13px; color: #34d399; font-weight: 600; letter-spacing: 0.5px; }
    
    .visualizer { width: 40px; height: 18px; background: rgba(0,0,0,0.4); border-radius: 6px; display: block; border: 1px solid rgba(16, 185, 129, 0.25); }

    .radar-container { position: relative; width: 100%; height: 110px; background: rgba(0,0,0,0.5); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(16, 185, 129, 0.25); overflow: hidden; margin-bottom: 8px; }
    canvas#radarCanvas { display: block; }

    .video-preview-container { position: relative; width: 100%; height: 140px; background: rgba(0,0,0,0.7); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(16, 185, 129, 0.25); overflow: hidden; margin-bottom: 8px; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; border-radius: 12px; }

    input[type="text"], select, textarea { font-size: 16px; }

    .select-box select {
      font-size: 16px;
      transform: scale(0.9);
      transform-origin: left center;
    }

    .tip, h3, .slider-header { font-size: 12px; }

    .drop-zone {
      border: 2px dashed rgba(52, 211, 153, 0.4);
      background: rgba(16, 185, 129, 0.05);
      padding: 12px;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      margin: 6px 0;
      transition: all 0.2s;
    }
    .drop-zone:hover {
      border-color: #34d399;
      background: rgba(16, 185, 129, 0.1);
    }
    .drop-zone input[type="file"] {
      display: none;
    }
    .drop-zone label {
      color: #6ee7b7;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: block;
    }

    button { 
      width: 100%; 
      padding: 10px; 
      margin: 3px 0; 
      background: #059669; 
      color: #fff; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 500; 
      transition: all 0.2s ease; 
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button.off { background: #0c261b; color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.15); }
    button:disabled { opacity: 0.25; transform: none; cursor: not-allowed; }

    .select-box { background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 12px; padding: 7px 10px; margin-top: 6px; display: flex; align-items: center; justify-content: space-between; }
    .select-box label { font-size: 11px; color: #a7f3d0; font-weight: 500; }
    .select-box select { background: #03130a; color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 5px 8px; border-radius: 8px; outline: none; width: 58%; font-weight: 600; cursor: pointer; }

    .slider-box { background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.15); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }

    .slider-header span:last-child { font-weight: 600; color: #d1fae5; }

<script>
function resetFilters(f1, f2) {
  if(!f1 || !f2) return;
  f1.type = 'allpass'; f1.frequency.value = 1000; f1.Q.value = 1; f1.gain.value = 0;
  f2.type = 'allpass'; f2.frequency.value = 1000; f2.Q.value = 1; f2.gain.value = 0;
}

function applyPresetEffect(fx, f1, f2, intensity = 1.0) {
  resetFilters(f1, f2);
  switch(fx) {
    case 'normal': break;
    case 'bass': f1.type = 'lowshelf'; f1.frequency.value = 250; f1.gain.value = 15 * intensity; break;
    case 'xbass': f1.type = 'lowshelf'; f1.frequency.value = 120; f1.gain.value = 24 * intensity; f2.type = 'peaking'; f2.frequency.value = 60; f2.gain.value = 14 * intensity; break;
    case 'subbass': f1.type = 'lowshelf'; f1.frequency.value = 80; f1.gain.value = 22 * intensity; f2.type = 'highpass'; f2.frequency.value = 30; break;
    case 'vocal': f1.type = 'peaking'; f1.frequency.value = 1500; f1.gain.value = 8 * intensity; f2.type = 'highpass'; f2.frequency.value = 120; break;
    case 'podcast': f1.type = 'peaking'; f1.frequency.value = 800; f1.gain.value = 6 * intensity; break;
    case 'live': f1.type = 'peaking'; f1.frequency.value = 600; f1.Q.value = 0.5; f1.gain.value = 6 * intensity; f2.type = 'highshelf'; f2.frequency.value = 4000; f2.gain.value = 5 * intensity; break;
    case 'cathedral': f1.type = 'peaking'; f1.frequency.value = 300; f1.gain.value = 10 * intensity; break;
    case 'vinyl': f1.type = 'highshelf'; f1.frequency.value = 3000; f1.gain.value = -12 * intensity; break;
    case 'lofi': f1.type = 'lowpass'; f1.frequency.value = 3500; f2.type = 'highpass'; f2.frequency.value = 300; break;
    case 'space8d': f1.type = 'peaking'; f1.frequency.value = 1000; f1.gain.value = 4 * intensity; break;
    case 'ether': f1.type = 'highshelf'; f1.frequency.value = 5000; f1.gain.value = 8 * intensity; break;
    case 'telephone': f1.type = 'bandpass'; f1.frequency.value = 1800; f1.Q.value = 2.5; break;
    case 'radio': f1.type = 'bandpass'; f1.frequency.value = 2200; f1.Q.value = 3.0; break;
    case 'muffled': f1.type = 'lowpass'; f1.frequency.value = 700; break;
    case 'treble': f1.type = 'highshelf'; f1.frequency.value = 5000; f1.gain.value = 12 * intensity; break;
    case 'airiness': f1.type = 'highshelf'; f1.frequency.value = 10000; f1.gain.value = 15 * intensity; break;
    case 'studio': f1.type = 'peaking'; f1.frequency.value = 2500; f1.gain.value = 3 * intensity; break;
    case 'edm': f1.type = 'lowshelf'; f1.frequency.value = 100; f1.gain.value = 18 * intensity; f2.type = 'highshelf'; f2.frequency.value = 8000; f2.gain.value = 8 * intensity; break;
    case 'cyberpunk': f1.type = 'peaking'; f1.frequency.value = 1200; f1.gain.value = 12 * intensity; break;
    case 'theater': f1.type = 'peaking'; f1.frequency.value = 400; f1.Q.value = 0.8; f2.type = 'highshelf'; f2.frequency.value = 6000; f2.gain.value = 6 * intensity; break;
    default:
      let codeNum = parseInt(fx.replace('fx','')) || 30;
      f1.type = (codeNum % 2 === 0) ? 'peaking' : 'bandpass';
      f1.frequency.value = 300 + (codeNum * 80) % 6000;
      f1.Q.value = 0.5 + (codeNum % 5);
      f1.gain.value = ((codeNum % 15) - 5) * intensity;
      break;
  }
}

const aFxSelect = document.getElementById('aFxSelect');
const aFxInt = document.getElementById('aFxInt');
const aFxIntVal = document.getElementById('aFxIntVal');

const aCanvas = document.getElementById('aCanvas');
const aCanvasCtx = aCanvas.getContext('2d');
const radarCanvas = document.getElementById('radarCanvas');
const radarCtx = radarCanvas.getContext('2d');

function initAudioContext() {
  if (aCtx) {
    if (aCtx.state === 'suspended') {
      aCtx.resume();
    }
    return;
  }
  aCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  // 创建并牢固建立管线通路
  aPanner = aCtx.createPanner();
  aPanner.panningModel = 'HRTF';
  
  aEq1 = aCtx.createBiquadFilter();
  aEq2 = aCtx.createBiquadFilter();
  
  aAnalyser = aCtx.createAnalyser();
  aAnalyser.fftSize = 32;
  
  aGain = aCtx.createGain();
  aGain.gain.value = aVol.value / 100;
  
  // 严格串联路由：Source -> Panner -> Eq1 -> Eq2 -> Analyser -> Gain -> Destination
  // 注意 Source 在每次播放时动态 connect 到 aPanner
  aPanner.connect(aEq1);
  aEq1.connect(aEq2);
  aEq2.connect(aAnalyser);
  aAnalyser.connect(aGain);
  aGain.connect(aCtx.destination);
}

pasteBtn.addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    cobaltUrlInput.value = text;
    aStatus.textContent = "✅ 已成功粘贴剪贴板内容";
  } catch (err) {
    aStatus.textContent = "⚠️ 无法自动读取，请手动粘贴";
  }
});

async function handleLinkProcessing(mode) {
  let rawUrl = cobaltUrlInput.value.trim();
  if (!rawUrl) {
    aStatus.textContent = "⚠️ 请先在框内粘贴资源链接！";
    return;
  }

  aStatus.textContent = "⏳ 正在多通道解析中...";
  parseVideoBtn.disabled = true;
  parseAudioBtn.disabled = true;

  try {
    initAudioContext();

    if (rawUrl.includes('github.com') && rawUrl.includes('/blob/')) {
      rawUrl = rawUrl.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
    }

    const isDirectMedia = rawUrl.match(/\.(mp3|wav|ogg|m4a|flac|aac|wma|webm)($|\?)/i) || rawUrl.includes('raw.githubusercontent.com');
    let resolvedUrl = rawUrl;

    if (!isDirectMedia) {
      try {
        const proxyApi = `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}`;
        const testRes = await fetch(proxyApi, { method: 'HEAD' });
        if (!testRes.ok) throw new Error("CORS Blocked");
        resolvedUrl = proxyApi;
      } catch (err) {
        throw new Error("该网页禁止前端跨域读取，请直接把媒体文件拖入下方方框内");
      }
    }

    if (mode === 'audio') {
      const response = await fetch(resolvedUrl);
      if (!response.ok) throw new Error("无法读取媒体流数据");
      const arrayBuffer = await response.arrayBuffer();
      aBuf = await aCtx.decodeAudioData(arrayBuffer);
      
      aPlay.disabled = false;
      aStop.disabled = false;
      aLoop.disabled = false;
      aStatus.textContent = "✅ 音频提取成功！已载入 8D 引擎";
      aPlay.click();
    } else {
      const vEl = document.getElementById('vElement');
      vEl.src = resolvedUrl;
      document.getElementById('vPlay').disabled = false;
      document.getElementById('vStop').disabled = false;
      aStatus.textContent = "✅ 已载入播放器";
    }

  } catch (err) {
    aStatus.textContent = `❌ ${err.message || "解析失败"}`;
  } finally {
    parseVideoBtn.disabled = false;
    parseAudioBtn.disabled = false;
  }
}

parseVideoBtn.addEventListener('click', () => handleLinkProcessing('video'));
parseAudioBtn.addEventListener('click', () => handleLinkProcessing('audio'));

// 万能音频解码核心
async function processAudioFile(file) {
  if (!file) return;
  initAudioContext();
  aStatus.textContent = `正在万能解码 ${file.name}...`;
  try {
    const arrayBuffer = await file.arrayBuffer();
    aBuf = await aCtx.decodeAudioData(arrayBuffer);
    
    aPlay.disabled = false;
    aStop.disabled = false;
    aLoop.disabled = false;
    aStatus.textContent = `✅ ${file.name} 加载完毕！点击播放按钮收听`;
  } catch(err) {
    aStatus.textContent = "❌ 该文件无法解码，请确认是否为有效音频文件";
  }
}

// 绑定文件选择
const aFile = document.getElementById('aFile');
aFile.addEventListener('change', e => {
  processAudioFile(e.target.files[0]);
});

// 绑定拖拽上传
const dropZone = document.getElementById('dropZone');
['dragenter', 'dragover'].forEach(eventName => {
  dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); dropZone.style.borderColor = '#fff'; }, false);
});
['dragleave', 'drop'].forEach(eventName => {
  dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); dropZone.style.borderColor = 'rgba(52, 211, 153, 0.4)'; }, false);
});
dropZone.addEventListener('drop', e => {
  const dt = e.dataTransfer;
  const files = dt.files;
  if (files && files.length > 0) {
    processAudioFile(files[0]);
  }
});

aFxSelect.addEventListener('change', e => {
  if (!aCtx) initAudioContext();
  applyPresetEffect(e.target.value, aEq1, aEq2, aFxInt.value / 100);
});

aFxInt.addEventListener('input', e => {
  aFxIntVal.textContent = e.target.value + '%';
  if (aCtx && aEq1) applyPresetEffect(aFxSelect.value, aEq1, aEq2, e.target.value / 100);
});

aPlay.addEventListener('click', async () => {
  if (!aBuf) {
    aStatus.textContent = "⚠️ 请先选择或上传音频文件！";
    return;
  }
  
  initAudioContext();
  if (aCtx.state === 'suspended') {
    await aCtx.resume();
  }

  // 停掉旧的播放源
  if (aSrc) { 
    try { aSrc.stop(); aSrc.disconnect(); } catch(e){} 
    aSrc = null; 
  }

  // 每次播放必须重新创建 BufferSource
  aSrc = aCtx.createBufferSource();
  aSrc.buffer = aBuf;
  aSrc.loop = aLoopState;
  
  // 严格连接到 8D Panner 节点
  aSrc.connect(aPanner);
  
  aSrc.start(0);
  aPlayState = true;
  
  aPlay.classList.remove('off');
  aStop.classList.add('off');
  aStatus.textContent = "▶ 8D 全景空间音效环绕播放中...";
  drawVisualizerAndRadar();
});

aStop.addEventListener('click', () => {
  if (aSrc) { try { aSrc.stop(); aSrc.disconnect(); } catch(e){} aSrc = null; }
  aPlayState = false;
  if (animId) cancelAnimationFrame(animId);
  aPlay.classList.add('off');
  aStop.classList.remove('off');
  aStatus.textContent = "⏹ 播放已停止";
  clearCanvases();
});

aLoop.addEventListener('click', () => {
  aLoopState = !aLoopState;
  aLoop.textContent = aLoopState ? "🔁 循环: 开" : "🔁 循环: 关";
  aLoop.className = aLoopState ? "" : "off";
  if (aSrc) aSrc.loop = aLoopState;
});

aVol.addEventListener('input', e => {
  aVolVal.textContent = e.target.value + '%';
  if (aGain) aGain.gain.value = e.target.value / 100;
});

speedRange.addEventListener('input', e => {
  speedVal.textContent = e.target.value + 'x';
});

function clearCanvases() {
  aCanvasCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);
  radarCtx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
  radarCtx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
  radarCtx.lineWidth = 1;
  radarCtx.beginPath();
  radarCtx.arc(170, 55, 40, 0, Math.PI * 2);
  radarCtx.stroke();
  radarCtx.fillStyle = '#34d399';
  radarCtx.beginPath();
  radarCtx.arc(170, 55, 4, 0, Math.PI * 2);
  radarCtx.fill();
}

function drawVisualizerAndRadar() {
  if (!aPlayState) return;
  animId = requestAnimationFrame(drawVisualizerAndRadar);
  
  const dataArray = new Uint8Array(aAnalyser.frequencyBinCount);
  aAnalyser.getByteFrequencyData(dataArray);
  aCanvasCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);
  let xPos = 2;
  for (let i = 0; i < 6; i++) {
    let h = (dataArray[i] / 255) * aCanvas.height;
    aCanvasCtx.fillStyle = '#34d399';
    aCanvasCtx.fillRect(xPos, aCanvas.height - h, 3, h);
    xPos += 5;
  }

  radarCtx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
  radarCtx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
  radarCtx.lineWidth = 1;
  radarCtx.beginPath();
  radarCtx.arc(170, 55, 40, 0, Math.PI * 2);
  radarCtx.stroke();

  const mode = spatialMode.value;
  const speed = parseFloat(speedRange.value);

  if (aPanner) {
    angle += 0.015 * speed;
    let x = 0, z = -1;

    if (mode === 'classic8D') {
      x = Math.sin(angle) * 3.5;
      z = Math.cos(angle) * 3.5;
    } else if (mode === 'wideTheater') {
      x = Math.sin(angle) * 4.5;
      z = -1.5;
    } else if (mode === 'frontBack') {
      x = 0;
      z = Math.sin(angle) * 4;
    } else if (mode === 'staticCenter') {
      x = 0; z = -2;
    }

    aPanner.positionX.value = x;
    aPanner.positionZ.value = z;

    let radarX = 170 + (x / 4) * 40;
    let radarY = 55 - (z / 4) * 26;
    radarCtx.fillStyle = '#10b981';
    radarCtx.beginPath();
    radarCtx.arc(radarX, radarY, 5, 0, Math.PI * 2);
    radarCtx.fill();
  }
}

clearCanvases();

// 视频本地处理逻辑
const vFile = document.getElementById('vFile');
const vElement = document.getElementById('vElement');
const vDropZone = document.getElementById('vDropZone');

function processVideoFile(file) {
  if (!file) return;
  vElement.src = URL.createObjectURL(file);
  document.getElementById('vPlay').disabled = false;
  document.getElementById('vStop').disabled = false;
  document.getElementById('vStatus').textContent = "✅ 本地视频已被成功载入";
}

vFile.addEventListener('change', e => {
  processVideoFile(e.target.files[0]);
});

['dragenter', 'dragover'].forEach(eventName => {
  vDropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); vDropZone.style.borderColor = '#fff'; }, false);
});
['dragleave', 'drop'].forEach(eventName => {
  vDropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); vDropZone.style.borderColor = 'rgba(52, 211, 153, 0.4)'; }, false);
});
vDropZone.addEventListener('drop', e => {
  const dt = e.dataTransfer;
  const files = dt.files;
  if (files && files.length > 0) {
    processVideoFile(files[0]);
  }
});

document.getElementById('vPlay').addEventListener('click', () => {
  vElement.play();
  document.getElementById('vStatus').textContent = "▶ 视频播放中...";
});

document.getElementById('vStop').addEventListener('click', () => {
  vElement.pause();
  vElement.currentTime = 0;
  document.getElementById('vStatus').textContent = "⏹ 视频播放已停止";
});

document.getElementById('vVol').addEventListener('input', e => {
  document.getElementById('vVolVal').textContent = e.target.value + '%';
  vElement.volume = e.target.value / 100;
});
</script>
